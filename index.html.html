<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>낭만시대 열전 — 패싸움 최종 프로토타입</title>
<style>
:root{--bg:#0c0f12;--panel:#181d22;--panel2:#101419;--line:#353b41;--ink:#eee4cc;--muted:#9da3a8;--gold:#c9a227;--red:#9a4b45;--green:#739078;--blue:#5a7c8d}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#090c0f,#17120f);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.wrap{max-width:1200px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;gap:10px;align-items:end;border-bottom:1px solid #5b5338;padding-bottom:10px}
h1{margin:0;font-family:serif;font-size:28px}.small{font-size:11px;color:var(--muted)}
button,select{background:#22261f;color:var(--ink);border:1px solid #5b5338;border-radius:7px;padding:8px 10px;font-weight:700}button{cursor:pointer}button.active{border-color:#e0bc4a}
.toolbar,.rankbar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.box{background:#181d22;border:1px solid var(--line);border-radius:10px;padding:11px}
.stats{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px}.team{text-align:center}.team b{font-size:24px}
.track{height:30px;background:#090c0f;border-radius:18px;position:relative}.track:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#666}.marker{position:absolute;top:3px;width:24px;height:24px;border-radius:50%;background:#c9a227;transform:translateX(-50%);transition:left .4s}.state{text-align:center;font-weight:900;margin-top:5px}
.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:10px;margin-top:10px}.scope{border-left:3px solid var(--blue);background:#101419;border-radius:6px;padding:9px}
.world{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.zone{background:#101419;border:1px solid #30363a;border-radius:8px;padding:8px}.zone.current{border-color:#d0ac40}.zbar{height:8px;background:#080a0c;border-radius:10px;overflow:hidden;margin:5px 0}.zbar i{display:block;height:100%;background:#8e7440}
.event{background:#101419;border:1px solid #454c52;border-radius:9px;padding:12px;margin-top:9px}.etype{font-size:11px;color:#deb54a;font-weight:900}.etitle{font-size:20px;font-weight:900;margin:4px 0}.edesc{line-height:1.55;color:#cbc5ba}.choices{display:grid;gap:7px;margin-top:10px}.choice{text-align:left;min-height:54px}.choice strong{display:block}.hint{font-size:10px;color:#a8aeb2}
.resultPanel{display:none;background:#11150f;border:1px solid #5f663f;border-radius:9px;padding:11px;margin-top:9px}.resultNarrative{line-height:1.6}.changes{margin-top:8px;border-top:1px dashed #3f464a;padding-top:7px;font-size:12px}.changes span{display:inline-block;margin:2px 5px 2px 0;padding:2px 5px;border:1px solid #555;border-radius:10px}
.roster{display:grid;gap:6px}.person{background:#101419;border:1px solid #30363a;border-radius:8px;padding:7px}.tags span{display:inline-block;font-size:10px;border:1px solid #5c5438;border-radius:12px;padding:2px 5px;margin:2px}.trait{color:#a9cad8}
.log{height:320px;overflow:auto;background:#0a0d10;border:1px solid #2d3236;border-radius:8px;padding:7px}.entry{padding:6px 2px;border-bottom:1px dashed #2e3337;line-height:1.45}.time{color:#c9a227;font-weight:900}.good{color:#9dc1a3}.bad{color:#df8e86}.big{color:#efc25c}.info{color:#9fc0cf}

.context{margin-top:8px;font-size:12px;line-height:1.5}
.autoBox{display:none;margin-top:9px;background:#131821;border:1px solid #465764;border-radius:9px;padding:10px}.autoLog{height:180px;overflow:auto;background:#0a0d10;border-radius:7px;padding:6px;margin-top:6px}

</style>
</head><body>
<div class="wrap">
<header><div><h1>낭만시대 열전 · 패싸움 최종 프로토타입</h1><div class="small">직위별 사건 엔진 · 선택 결과 서술/변화 요약 · 본게임 관계 변수 희귀 이벤트 · 맞장 v4.1 연동</div></div><div><button onclick="newBattle()">새 전투</button><button id="runBtn" onclick="toggleRun()">전투 시작</button></div></header>

<div class="rankbar"><span class="small" style="align-self:center">직위</span>
<button class="active" onclick="setRank('grunt',this)">말단</button><button onclick="setRank('leader',this)">조장</button><button onclick="setRank('officer',this)">간부</button><button onclick="setRank('boss',this)">두목</button></div>

<div class="toolbar">
<label>경찰 관계 <select id="policeSel" onchange="syncContext()"><option value="-40">적대</option><option value="0" selected>보통</option><option value="40">우호</option></select></label>
<label>지역 우호도 <select id="localSel" onchange="syncContext()"><option value="-40">낮음</option><option value="0" selected>보통</option><option value="40">높음</option></select></label>
<label>지역 영향력 <select id="influenceSel" onchange="syncContext()"><option value="-40">상대 우세</option><option value="0" selected>비슷함</option><option value="40">우리 우세</option></select></label>
</div>

<div class="stats">
<div class="box team">우리 <b id="ourMen">?</b>명<br>사기 <span id="ourMorale">?</span></div>
<div class="box"><div class="track"><div class="marker" id="marker"></div></div><div class="state" id="state"></div></div>
<div class="box team">상대 <b id="enemyMen">?</b>명<br>사기 <span id="enemyMorale">?</span></div>
</div>

<div class="grid">
<main>
<div class="box">
<div class="scope" id="scope"></div>
<div id="objective" class="context"></div>
<div class="world" id="world"></div>
<div id="eventArea"></div>
<div id="resultPanel" class="resultPanel"></div>
<div id="autoBox" class="autoBox"><b>전투 이탈 — 남은 전투 자동 진행</b><div class="small">플레이어는 더 이상 개입하지 않습니다.</div><div id="autoLog" class="autoLog"></div></div>
<div id="finalBox" class="finalBox"></div>
</div>
</main>

<aside>
<div class="box"><b id="rosterTitle">주변 인물</b><div id="roster" class="roster"></div></div>
<div class="box" style="margin-top:8px"><b>전투 연대기</b><div id="log" class="log"></div></div>
</aside>
</div>
</div>

<div id="duelOverlay" class="duelOverlay">
<div style="position:absolute;right:18px;top:14px;z-index:102">
<button onclick="cancelBrokenDuel()">맞장 화면 닫기</button>
</div>
<iframe id="duelFrame" class="duelFrame"></iframe>
</div>

function ev(kind,title,desc,opts,rarity="일반"){return{kind,title,desc,opts,rarity,age:0,timeout:ri(4,7)}}
function generateEvent(){
 let pool=rankEvents();
 if(Math.random()<.18)pool=pool.concat(commonRareEvents());
 ACTIVE=pick(pool);
 if(["duel","officerAppears","rivalLeader","duelRequest","famousDuel"].includes(ACTIVE.kind))ACTIVE.enemy=makeEnemy(ACTIVE.kind!=="duel");
 G.cool=2;add("사건 발생: "+ACTIVE.title,"big");
}
function expireEvent(){if(!ACTIVE)return;showOutcome("망설이는 사이 상황이 흘러갔다.","대응이 늦어 주변 전황이 불리해졌다.",[{t:"전황",v:-6},{t:"사기",v:-2}]);G.zones[G.playerZone].p-=6;G.morO-=2;ACTIVE=null;G.cool=2}
function chooseEvent(i){
 if(!ACTIVE)return;
 let e=ACTIVE;
 if((e.kind==="duel"&&i===0)||(e.kind==="officerAppears"&&i===0)||(e.kind==="rivalLeader"&&i===0)||(e.kind==="duelRequest"&&i===1)){
   startDuel(e,e.enemy||makeEnemy(true));return;
 }
 let outcome=resolveEvent(e,i);
 showOutcome(outcome.title,outcome.narrative,outcome.changes);
 ACTIVE=null;G.cool=2;render();
}

function renderEvent(){
 if(G.playerOut){eventArea.innerHTML="";return}
 if(!ACTIVE){eventArea.innerHTML='<div class="event"><div class="etype">진행 중</div><div class="etitle">새 사건을 기다리는 중</div><div class="edesc">전황·직위·관계 상태에 맞는 사건이 발생합니다. 같은 4지선다가 반복되지 않도록 사건마다 선택지가 다릅니다.</div></div>';return}
 eventArea.innerHTML='<div class="event"><div class="etype">'+ACTIVE.rarity+' 사건 · '+RANKS[rank].name+' · '+Math.max(0,ACTIVE.timeout-ACTIVE.age)+'틱 내 대응</div><div class="etitle">'+ACTIVE.title+'</div><div class="edesc">'+ACTIVE.desc+'</div><div class="choices">'+ACTIVE.opts.map((o,i)=>'<button class="choice" onclick="chooseEvent('+i+')"><strong>'+o+'</strong><span class="hint">'+choiceHint(ACTIVE.kind,i)+'</span></button>').join("")+'</div></div>';
}
function choiceHint(k,i){
 const H={duel:["맞장 v5 실제 진입","전황 손실 가능"],friendDown:["부상 위험 / 명성 보상","동료 추가 피해 위험","안정적"],gapOrder:["고위험 고보상","중간 위험","안전"],twoCrises:["한쪽 확실히 살림","핵심 인물 제거 기회","둘 다 실패 가능"],reserveDecision:["예비대 전부 소모","절반 보존","후반 대비"],policeContact:["경찰 악화 방지","전황 우선","관계 크게 악화 가능"],localHelp:["피해 최소화","퇴로 확보","주민 도움 거절"]};
 return(H[k]&&H[k][i])||"결과는 현재 전황과 인물 상태에 따라 달라짐";
}
function renderWorld(){world.innerHTML=G.zones.map((z,i)=>'<div class="zone '+(rank==="grunt"&&i===G.playerZone?"current":"")+'"><b>'+ZN[i]+'</b><div class="small">'+z.terrain+'</div><div class="zbar"><i style="width:'+cl(50+z.p*.45,3,97)+'%"></i></div><div class="small">'+(rank==="grunt"&&i!==G.playerZone?"멀리서 자세히 알 수 없음":z.our+" vs "+z.enemy+" · "+(z.p>25?"우리 우세":z.p<-25?"열세":"팽팽"))+'</div>'+(rank==="grunt"&&!G.playerOut?'<button onclick="moveZone('+i+')">'+(i===G.playerZone?"현재 위치":"이동")+'</button>':"")+'</div>').join("")}
function moveZone(i){if(rank!=="grunt"||G.playerOut)return;G.playerZone=i;ACTIVE=null;G.cool=1;add(ZN[i]+" 쪽으로 이동했다.","info");render()}
function renderRoster(){let list=rank==="grunt"?G.people.filter(p=>p.zone===G.playerZone).slice(0,4):rank==="leader"?G.people.slice(0,6):G.people.slice(0,rank==="officer"?9:12);rosterTitle.textContent=rank==="grunt"?"내 주변 인물":rank==="leader"?"내 조원":rank==="officer"?"담당 인물":"주요 간부/장수";roster.innerHTML=list.map(p=>'<div class="person"><b>'+p.name+'</b> <span class="small">'+p.status+'</span><div class="tags"><span>'+p.pers+'</span><span class="trait">'+p.trait+'</span></div><div class="small">체력 '+p.hp+' · 통솔 '+p.tong+' · 충성 '+p.loyal+'</div></div>').join("")}
function render(){
 let v=rank==="grunt"?0:rank==="leader"?1:2;
 if(v===0){ourMen.textContent="대략 많음";enemyMen.textContent="?";ourMorale.textContent="?";enemyMorale.textContent="?"}
 else if(v===1){ourMen.textContent="약 "+Math.round(G.our/5)*5;enemyMen.textContent="약 "+Math.round(G.enemy/5)*5;ourMorale.textContent=G.morO>60?"높음":"보통";enemyMorale.textContent="?"}
 else{ourMen.textContent=G.our;enemyMen.textContent=G.enemy;ourMorale.textContent=Math.round(G.morO);enemyMorale.textContent=Math.round(G.morE)}
 marker.style.left=(50+G.front*.46)+"%";marker.style.opacity=rank==="grunt"?.4:1;state.textContent=rank==="grunt"?(G.front>30?"우리가 미는 분위기":G.front<-30?"심하게 밀리는 분위기":"정신없는 난전"):(G.front>35?"우리 우세":G.front<-35?"상대 우세":"팽팽");
 scope.innerHTML="<b>"+RANKS[rank].name+"</b><br>"+RANKS[rank].desc;
 objective.innerHTML=(rank==="grunt"?'<span class="pill">HP '+G.hp+'/'+G.maxHp+'</span><span class="pill">SP '+Math.round(G.sta)+'/'+G.maxSta+'</span><span class="pill">개인 명성 '+G.rep+'</span>'+(G.playerStatuses.length?'<span class="pill">상태 '+G.playerStatuses.join(", ")+'</span>':""):rank==="leader"?'<span class="pill">지휘력 '+G.cmd+'/2</span><span class="pill">조원 생존</span>':rank==="officer"?'<span class="pill">지휘력 '+G.cmd+'/4</span><span class="pill">동시 위기 우선순위</span>':'<span class="pill">지휘력 '+G.cmd+'/6</span><span class="pill">예비 '+G.reserve+'명</span>')+'<br><span class="small">경찰 '+G.police+' · 지역 우호도 '+G.local+' · 영향력 '+G.influence+'</span>';
 objective.innerHTML += '<br><span class="small">주먹 '+G.stats.juk+' · 맷집 '+G.stats.mat+' · 날렵 '+G.stats.nal+' · 체력 '+G.stats.vit+' · 지구력 '+G.stats.end+' · 머리 '+G.stats.meo+'</span>';
 renderWorld();renderRoster();renderEvent();
}
function endCheck(){
 if(G.end)return;
 if(G.front>=92||G.enemy<=5||G.morE<=4)return finish(true,"상대 전열 붕괴");
 if(G.front<=-92||G.our<=5||G.morO<=4)return finish(false,"우리 전열 붕괴");
 if(G.t>=900)return finish(G.front>=0,"장시간 충돌 후 종료");
}
function finish(win,why){
 G.end=true;G.run=false;if(timer)clearInterval(timer);if(AUTO_TIMER)clearInterval(AUTO_TIMER);runBtn.textContent="종료";
 add((win?"우리 조직 승리":"상대 조직 승리")+" — "+why,"big");
 finalBox.style.display="block";
 finalBox.innerHTML='<b>패싸움 결과: '+(win?"승리":"패배")+'</b><br><span class="small">'+why+'</span><hr style="border-color:#4a432e"><b>개인 결과</b><br>일기토 '+G.personal.duelWins+'승 '+G.personal.duelLosses+'패 · 구조 '+G.personal.rescues+'회 · 명성 '+G.rep+' · '+(G.playerOut?"전투 이탈":"끝까지 참가")+(G.personal.injuries.length?'<br>후유증 후보: '+[...new Set(G.personal.injuries)].join(", "):"")+'<br><br><b>조직 결과</b><br>우리 잔존 '+G.our+'명 / 상대 잔존 '+G.enemy+'명<br>최종 사기 '+Math.round(G.morO)+' : '+Math.round(G.morE)+'<br>경찰 관계 '+G.police+' · 지역 우호도 '+G.local+' · 지역 영향력 '+G.influence;
}
function add(t,c=""){let d=document.createElement("div");d.className="entry "+c;d.innerHTML='<span class="time">'+fmt(G?G.t:0)+'</span> '+t;log.appendChild(d);log.scrollTop=log.scrollHeight;if(G)G.history.push(t)}
function fmt(x){let m=Math.floor(x/60),s=x%60;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
newBattle();

</script>
</body></html>
